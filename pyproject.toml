[project]
name = "terminator"
version = "0.2.0"
description = "Localhost security lab agent with adaptive pentest mode"
requires-python = ">=3.11"

[project.scripts]
terminator = "terminator.agent.loop:main"
terminator-autorun = "terminator.pentest.runner:main"
terminator-cli = "terminator.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
